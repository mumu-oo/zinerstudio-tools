# Cloudflare Worker 部署設定
# 部署前置(用穆穆現有的 Cloudflare 帳號,Claude 來操作):
#   1. npx wrangler login
#   2. npx wrangler kv namespace create STATE   → 把回傳的 id 填進下面
#   3. npx wrangler secret put LINE_CHANNEL_SECRET   # LINE 的通行證用 ID+secret 現換(stateless token),不需長期 access token
#      npx wrangler secret put LLM_API_KEY
#      npx wrangler secret put ADMIN_SECRET          # 穆穆「認主」的通關密語
#      npx wrangler secret put DISCORD_WEBHOOK_URL   # 選配:留言板通知
#   4. npx wrangler deploy → 把網址填到 LINE Developers 的 Webhook URL

name = "zinerstudio-line-bot"
main = "src/index.js"
compatibility_date = "2026-06-01"

[[kv_namespaces]]
binding = "STATE"
id = "e0762f279b254aa18011e22f716f0b99"

[vars]
# 誌造所官方帳號的 Messaging API Channel ID(非機密;secret 走 wrangler secret)
LINE_CHANNEL_ID = "2007766255"
# 模型可插拔:openai 相容端點(OpenAI / DeepSeek / …)或 anthropic
LLM_PROVIDER = "openai"
LLM_BASE_URL = "https://api.openai.com/v1"
LLM_MODEL = "gpt-5-mini"
